<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="estilosIA.css">
</head>
<body>

<header>
    <h1>Recetas de Cocina</h1>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="catalogo.html">Recetas</a>
        <a href="contacto.html">Contacto</a>
        <a href="acerca.html">Quiénes somos</a>
    </nav>
</header>

<main>
    <section class="contacto">
        <h2>Contacto</h2>

        <p>
            Podés utilizar el siguiente formulario para comunicarte
            con nosotros.
        </p>

        <form action="#" method="get">

            <label for="nombre">Nombre</label>
            <input type="text"
                   id="nombre"
                   name="nombre"
                   required>

            <label for="email">Correo electrónico</label>
            <input type="email"
                   id="email"
                   name="email"
                   required>

            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje"
                      name="mensaje"
                      rows="6"
                      required></textarea>

            <button type="submit">Enviar</button>

        </form>
    </section>
</main>

<footer>
    <p>Recetas de Cocina</p>
</footer>

</body>
</html>
